async function join() {
  try {
    if (!uid) {
      throw Error("Still signing in. Try again.");
    }

    const c = $("code").value.trim().toUpperCase();

    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(c)) {
      throw Error("Enter a valid 6-character room code.");
    }

    $("status").textContent = "Joining room...";

    const r = ref(db, `drawGuessRooms/${c}`);
    const check = await get(r);

    if (!check.exists()) {
      throw Error("Room not found.");
    }

    const result = await runTransaction(
      r,
      d => {
        // Firebase may initially call the transaction with an empty local cache.
        // Returning undefined at that point aborts an otherwise valid join.
        if (d === null) return d;
        if (d.status !== "waiting") return;

        d.players = d.players || {};

        // Check if player has already joined
        const existing = Object.entries(d.players)
          .find(([i, p]) => p && p.uid === uid);

        if (existing) {
          return d;
        }

        // Slots 0, 1, 2, 3 = 4 players
        for (let i = 0; i < 4; i++) {
          if (!d.players[i]) {
            d.players[i] = {
              uid: uid,
              name: playerName(),
              score: 0
            };

            return d;
          }
        }

        // All 4 slots occupied
        return;
      },
      { applyLocally: false }
    );

    if (!result.committed) {
      throw Error("Unable to join. Check the room code, room status and available slots.");
    }

    const updatedRoom = result.snapshot.val();

    const myEntry = Object.entries(updatedRoom.players || {})
      .find(([i, p]) => p && p.uid === uid);

    if (!myEntry) {
      throw Error("Unable to find your player slot.");
    }

    room = c;
    seat = Number(myEntry[0]);
    host = updatedRoom.host === uid;

    status(e);
  }
